  thead th {

    font-size: 0.78rem;

p read specloop's own real `AGENTS.md`/`planning/*` instead of the target's; moved fixture outside the repo entirely to fix.","note":""},{"id":"T004","owner":"agent","status":"done","text":"OpenCode: `when_to_use` tolerance confirmed pass (T003) — no trim needed. Cursor/Codex CLI results still open (T001/T002) but don't block this task per `requirements.md`'s acceptance criteria, which only requires one harness's result.","note":""},{"id":"T005","owner":"agent","status":"done","text":"Document the install path for a harness that doesn't read `.claude-plugin/plugin.json`: point it at (or copy `skills/` into) its own skills-scan directory — `.agents/skills/` as the vendor-neutral default, `.opencode/skills/` and `.claude/skills/` named as equivalent aliases. Add to `README.md`'s `## Install` section.","note":""},{"id":"T006","owner":"agent","status":"done","text":"Generalize the skill-recommendation step off \"Claude Code skills/plugins\": `skills/start/SKILL.md` Phase 4 step 1, `skills/start/references/question-bank.md`'s Phase C `helper-skills` row, and `README.md`'s Quickstart line 62 phrasing.","note":""},{"id":"T007","owner":"agent","status":"done","text":"Extend `scripts/check-skill-consistency.mjs` with a check that `skills/start/SKILL.md`'s helper-skills step no longer hardcodes \"Claude Code\" (the `.claude-plugin/plugin.json` / `claude --plugin-dir` distribution mentions elsewhere in the file are fine and excluded).","note":""},{"id":"T008","owner":"agent","status":"done","text":"Updated `planning/architecture.md`'s Container section to name OpenCode as verified (and how), Cursor/Codex CLI as not yet audited. All three acceptance criteria in `requirements.md` are now met (one harness verified, install path documented, Container section updated) — `planning/roadmap.md`'s `022` row flipped to `done`. T001/T002 (Cursor, Codex CLI) left `todo` below as optional follow-up for broader confidence, not blocking closure.","note":""}]},{"id":"023","plan":"fix-log","status":"done","dependsOn":"—","stage":"—","priority":"18","tasks":[{"id":"T001","owner":"agent","status":"done","text":"Create `planning/fix/README.md`: the convention, the `report.md` template, and the independent numbering rule","note":""},{"id":"T002","owner":"agent","status":"done","text":"Document the convention and its deliberate disconnection from the loop/roadmap in `planning/architecture.md`'s Resolved section","note":""},{"id":"T003","owner":"agent","status":"done","text":"Add this spec to `planning/roadmap.md` and `CHANGELOG.md`","note":""}]},{"id":"024","plan":"loop-skill-verification","status":"done","dependsOn":"002","stage":"—","priority":"8","tasks":[{"id":"T001","owner":"agent","status":"done","text":"Build the fixture repo skeleton under `test/` (gitignored): `AGENTS.md`, `planning/architecture.md`, `planning/styles.md`, `planning/roadmap.md` with at least one spec mixing `[agent]`/`[human]` tasks, one all-`[human]` spec, and two eligible `todo` rows with different `Priority` numbers","note":"`test/loop-verify-fixture/`: 001 (all-human, priority 1), 002 (mixed, priority 2), 003 (agent-only, priority 3), later 004 (stop-test, priority 4). `planning/styles.md` deliberately not created. Separate isolated fixture `test/loop-verify-allhuman/` for the all-human-backlog check."},{"id":"T002","owner":"agent","status":"done","text":"Write the stub worker script: appends received argv + full prompt to a file, then exits success, exits non-zero with a plain error, or exits non-zero with usage-limit-shaped wording, selected by an env var/arg","note":"`test/loop-verify-fixture/stub-worker.cjs`. Used to verify prompt contents (success + quota-suspicion branches) before the run pivoted to real worker CLIs per user direction — see T004's note on scope actually covered."},{"id":"T003","owner":"human","status":"done","text":"Live run: `specloop:loop-setup` against the fixture","note":"Q&A walked through for real: worker CLI question answered with the stub first, then the run was reconfigured to real `claude`/`opencode` workers per user direction. `.specloop/loop.config.json` and `.specloop/.gitignore` written correctly both times. All-human-backlog check verified separately in the isolated `test/loop-verify-allhuman/` fixture (single all-`[human]` eligible spec) — condition correctly identified by Phase 0's own text; not additionally interrupted the user with a synthetic Q&A for a fixture-only decision. Legacy `workerCli`/`workerArgs` shape verified live: wrote a config in that shape, read it as `workers[0]` per `skills/loop`'s Phase 0 text, dispatched a real `opencode` call from it — worked identically to the array form."},{"id":"T004","owner":"human","status":"done","text":"Live run: `specloop:loop` against the fixture, cycling the stub through all three exit modes across several tasks, then telling it to stop mid-task","note":"**Scope actually covered, per explicit user direction mid-run**: dropped the stub-based quota-suspicion live cycle (already covered once via the stub before the pivot — see T002's note) and re-ran the real work with genuine `claude` and `opencode` workers instead, on the user's instruction to \"test with the real operators, and see what they respond, nothing weird with scripts.\" Full observed-result table below. Also added `004-stop-test` mid-run specifically to live-verify Phase 4 (not in the original fixture design) — dispatched a real native sub-agent, killed it mid-flight with `TaskStop`, confirmed the task was marked `interrupted` (not `blocked`/`done`) and nothing else started."},{"id":"T005","owner":"human","status":"done","text":"Write the full observed-result table (see `design.md`'s template) as a note here, and fix forward in `skills/loop`/`skills/loop-setup` anything that didn't match the skill's own stated rule","note":"See table below. Two real gaps found and fixed in `skills/loop/SKILL.md`'s Phase 3: (1) it never said *how* a briefing reaches a CLI subprocess — now explicit (`<cli> <args...> \"<briefing>\"`, args first, briefing last as one argument, plus a bounded timeout and no stdin, matching the deleted `worker.ts`'s convention); (2) it said \"watch the output as it happens,\" which doesn't hold for Claude Code's own native sub-agent mechanism — that path is asynchronous (dispatch, then a completion notification), not a live stream. Both fixes were exercised correctly by every live task dispatched after they landed."},{"id":"T006","owner":"human","status":"done","text":"Re-run just the affected step(s) for anything fixed in T005 to confirm the fix; flip this spec `done` once every bullet has a matching observed result","note":"Both `T005` fixes were live-exercised by the real runs that followed them in the same session (see table) — no separate re-run needed. One behavior intentionally left unverified: the harness-synergy branch's exact wording under a harness other than Claude Code (this session can only run Claude Code) — noted in `planning/handoff.md`, not blocking."}]},{"id":"025","plan":"master-handoff","status":"todo","dependsOn":"002","stage":"requirements","priority":"—","tasks":[]}],"drift":[],"fixes":[{"id":"001","name":"language-field-format","scope":"018","found":"`skills/start/SKILL.md`'s Phase 6 never specified a format for `.specloop/loop.config.json`'s\n`language` field — just \"the working language from the tone dimension.\" Two live-verified\nfixtures picked different formats for the same dimension: `test/architecture-absent-fixture`\nwrote `\"language\": \"Spanish\"` (spelled-out, English name of the language), while\n`style-verify-fixture` (018's live verification, 2026-09-13) wrote `\"language\": \"es\"`\n(a two-letter code). Both satisfy `skills/loop`'s Phase 3 consumption of the field (it's\njust interpolated into a sentence), so neither was ever caught as wrong — they'd just\nread differently to a human or another tool comparing two projects' configs.","fix":"Researched the industry standard before picking one (not guessed): BCP 47 is the\nmodern standard for language tags in software (what `Intl`/most JS tooling reads),\nbuilt on ISO 639-1 two-letter codes for the plain-language case with no region/script\nsubtag needed. Encoding: RFC 8259 requires JSON to be UTF-8 and says a BOM MUST NOT be\nadded, which we extend as a general rule to every scaffolded file, not just JSON.\n\nChanged `skills/start/SKILL.md`'s Phase 6 `loop.config.json` template and prose to\nrequire the lowercase BCP 47 / ISO 639-1 code (`\"es\"`, not `\"Spanish\"`), and added a\n`planning/architecture.md` Fixed rule generalizing this to any future coded field a\nskill writes (not just `language`) plus the UTF-8-no-BOM rule for every scaffolded\nfile. Existing fixtures under `test/` were left as-is (gitignored, local-only,\ndisposable) — the fix is in the skill text new runs read, not a retroactive edit of\nold fixture output.","date":"2026-09-13"},{"id":"002","name":"stage-not-reset-on-done","scope":"002","found":"Live-verified during `018`'s delivery check (2026-09-13, `style-verify-fixture` under\nOpenCode): `skills/loop/SKILL.md`'s Phase 2 roll-up step rolled a spec's `Status` up to\n`done` correctly, but left its `Stage` cell at `looping` — `planning/roadmap.md` ended\nup with `done | — | looping | 1` for the completed spec. `planning/architecture.md`'s\nown `Stage` column definition says `—` once `done`, but the roll-up step's instructions\nonly ever said \"write that status into the matching row,\" with no mention of `Stage` at\nall — a real gap, not a one-off mistake by the harness running it (OpenCode followed the\nskill text exactly as written).","fix":"`skills/loop/SKILL.md` Phase 2: when the status being written is `done`, also write `—`\ninto that row's `Stage` cell in the same edit; every other status leaves `Stage`\nuntouched. `planning/architecture.md`'s `Stage` bullet updated to name `specloop:loop`\nas the writer of this transition too, alongside its existing `looping` transition.","date":"2026-09-13"}]}</script>
<script>
(function () {
  "use strict";

  var STATUS_LABELS = {
    done: "done",
    in_progress: "in_progress",
    blocked: "blocked",
    interrupted: "interrupted",
    todo: "todo"
  };

  function statusBadge(status) {
    var key = STATUS_LABELS.hasOwnProperty(status) ? status : "todo";
    var span = document.createElement("span");
    span.className = "badge badge-" + key;
    span.textContent = status || "todo";
    return span;
  }

  function text(tag, content, className) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = content == null ? "" : content;
    return el;
  }

  function cell(content) {
    var td = document.createElement("td");
    if (content instanceof Node) {
      td.appendChild(content);
    } else {
      td.textContent = content == null ? "" : content;
    }
    return td;
  }

  function toggleRow(mainRow, detailRow) {
    var isHidden = detailRow.hidden;
    detailRow.hidden = !isHidden;
    mainRow.classList.toggle("expanded", isHidden);
  }

  function buildTaskTable(tasks) {
    var wrap = document.createElement("div");
    if (!tasks || tasks.length === 0) {
      wrap.appendChild(text("div", "No tasks recorded for this spec.", "empty-state"));
      return wrap;
    }

    var table = document.createElement("table");
    table.className = "task-table";

    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    ["ID", "Owner", "Status", "Text"].forEach(function (h) {
      headRow.appendChild(text("th", h));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    tasks.forEach(function (task) {
      var row = document.createElement("tr");
      row.appendChild(cell(task.id || ""));
      row.appendChild(cell(task.owner || ""));
      row.appendChild(cell(statusBadge(task.status)));

      var textCell = document.createElement("td");
      textCell.appendChild(text("span", task.text || ""));
      if (task.note) {
        textCell.appendChild(text("span", task.note, "task-note"));
      }
      row.appendChild(textCell);

      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function renderRoadmap(specs) {
    var tbody = document.getElementById("roadmap-body");
    tbody.innerHTML = "";

    if (!specs || specs.length === 0) {
      var row = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 7;
      td.appendChild(text("div", "No specs found in planning/roadmap.md.", "empty-state"));
      row.appendChild(td);
      tbody.appendChild(row);
      return;
    }

    specs.forEach(function (spec) {
      var mainRow = document.createElement("tr");
      mainRow.className = "spec-row";

      var caretCell = document.createElement("td");
      caretCell.appendChild(text("span", "▸", "toggle-caret"));
      mainRow.appendChild(caretCell);

      mainRow.appendChild(cell(spec.id || ""));
      mainRow.appendChild(cell(spec.plan || ""));
      mainRow.appendChild(cell(statusBadge(spec.status)));
      mainRow.appendChild(cell(spec.dependsOn || "—"));
      mainRow.appendChild(cell(spec.stage || "—"));
      mainRow.appendChild(cell(spec.priority || "—"));

      var detailRow = document.createElement("tr");
      detailRow.className = "detail-row";
      detailRow.hidden = true;
      var detailCell = document.createElement("td");
      detailCell.colSpan = 7;
      var panel = document.createElement("div");
      panel.className = "detail-panel";
      panel.appendChild(buildTaskTable(spec.tasks));
      detailCell.appendChild(panel);
      detailRow.appendChild(detailCell);

      mainRow.addEventListener("click", function () {
        toggleRow(mainRow, detailRow);
      });

      tbody.appendChild(mainRow);
      tbody.appendChild(detailRow);
    });
  }

  function renderDrift(drift) {
    var section = document.getElementById("drift-section");
    var list = document.getElementById("drift-list");
    list.innerHTML = "";

    if (!drift || drift.length === 0) {
      section.hidden = true;
      return;
    }

    section.hidden = false;
    drift.forEach(function (entry) {
      var li = document.createElement("li");
      li.appendChild(text("span", (entry.specId || "?") + ": ", "drift-spec"));
      if (entry.rule) {
        li.appendChild(text("span", entry.rule + " — ", "drift-rule"));
      }
      li.appendChild(document.createTextNode(entry.message || ""));
      list.appendChild(li);
    });
  }

  function buildFixDetail(fix) {
    var wrap = document.createElement("div");
    wrap.className = "fix-detail";
    var dl = document.createElement("dl");

    if (fix.found) {
      dl.appendChild(text("dt", "Found"));
      dl.appendChild(text("dd", fix.found));
    }
    if (fix.fix) {
      dl.appendChild(text("dt", "Fix"));
      dl.appendChild(text("dd", fix.fix));
    }

    if (!dl.children.length) {
      wrap.appendChild(text("div", "No Found/Fix detail recorded.", "empty-state"));
      return wrap;
    }

    wrap.appendChild(dl);
    return wrap;
  }

  function renderFixLog(fixes) {
    var container = document.getElementById("fix-log-body");
    container.innerHTML = "";

    if (!fixes || fixes.length === 0) {
      container.appendChild(text("div", "No fix-log entries.", "empty-state"));
      return;
    }

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    ["", "ID", "Name", "Scope", "Date"].forEach(function (h) {
      headRow.appendChild(text("th", h));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");

    fixes.forEach(function (fix) {
      var mainRow = document.createElement("tr");
      mainRow.className = "fix-row";

      var caretCell = document.createElement("td");
      caretCell.appendChild(text("span", "▸", "toggle-caret"));
      mainRow.appendChild(caretCell);

      mainRow.appendChild(cell(fix.id || ""));
      mainRow.appendChild(cell(fix.name || ""));
      mainRow.appendChild(cell(fix.scope || "—"));
      mainRow.appendChild(cell(fix.date || "—"));

      var detailRow = document.createElement("tr");
      detailRow.className = "detail-row";
      detailRow.hidden = true;
      var detailCell = document.createElement("td");
      detailCell.colSpan = 5;
      var panel = document.createElement("div");
      panel.className = "detail-panel";
      panel.appendChild(buildFixDetail(fix));
      detailCell.appendChild(panel);
      detailRow.appendChild(detailCell);

      mainRow.addEventListener("click", function () {
        toggleRow(mainRow, detailRow);
      });

      tbody.appendChild(mainRow);
      tbody.appendChild(detailRow);
    });

    table.appendChild(tbody);
    container.appendChild(table);
  }

  function renderGeneratedAt(iso) {
    var el = document.getElementById("generated-at");
    if (!iso) {
      el.textContent = "";
      return;
    }
    el.textContent = "Generated " + iso;
  }

  function main() {
    var dataEl = document.getElementById("dashboard-data");
    var raw = dataEl ? dataEl.textContent : "";
    var data;
    try {
      data = JSON.parse(raw);
    } catch (err) {
      data = { generatedAt: "", specs: [], drift: [], fixes: [] };
    }

    renderGeneratedAt(data.generatedAt);
    renderDrift(data.drift);
    renderRoadmap(data.specs);
    renderFixLog(data.fixes);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", main);
  } else {
    main();
  }
})();
</script>
