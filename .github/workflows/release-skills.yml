name: release-skills

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deterministic skills archive
        run: |
          set -euo pipefail
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            skills/ \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            | gzip -n > specloop-skills.tar.gz

      - name: Generate checksum
        run: sha256sum specloop-skills.tar.gz > specloop-skills.tar.gz.sha256

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" specloop-skills.tar.gz specloop-skills.tar.gz.sha256 --clobber
