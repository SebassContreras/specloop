name: release-skills

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the dashboard script compiles
        run: python3 -c "import ast; ast.parse(open('skills/status/scripts/build_dashboard.py', encoding='utf-8').read())"

      - name: Build deterministic skills archive
        run: |
          set -euo pipefail
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            skills/ \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            | gzip -n > specloop-skills.tar.gz

      - name: Check archive contents
        run: |
          set -euo pipefail
          tar -tzf specloop-skills.tar.gz > archive-files.txt
          grep -qx 'skills/status/SKILL.md' archive-files.txt
          grep -qx 'skills/status/scripts/build_dashboard.py' archive-files.txt
          grep -qx 'skills/status/references/template.html' archive-files.txt
          if grep -E '(^(planning|examples|scripts|test|\.github)/|__pycache__|\.pyc$)' archive-files.txt; then
            echo "archive contains repo-only paths" >&2
            exit 1
          fi
          rm archive-files.txt

      - name: Generate checksum
        run: sha256sum specloop-skills.tar.gz > specloop-skills.tar.gz.sha256

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" specloop-skills.tar.gz specloop-skills.tar.gz.sha256 --clobber
