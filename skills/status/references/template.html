<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>specloop dashboard</title>
<!--
  This file is a fixed, self-contained template. skills/status/scripts/build_dashboard.py
  is the sole producer of the JSON substituted into the placeholder token inside the
  <script type="application/json" id="dashboard-data"> tag near the end of this file —
  read that script for the exact JSON schema, not this comment. The placeholder token
  must appear exactly once in this file so the script's find-and-replace works unambiguously.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --surface: #ffffff;
    --surface-alt: #f0f1f3;
    --border: #dcdde1;
    --text: #1c1e21;
    --text-muted: #5b5f66;
    --link: #2452d9;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 1px 8px rgba(0, 0, 0, 0.04);

    --status-done-bg: #dcf5e3;
    --status-done-fg: #146c2e;
    --status-in_progress-bg: #dceaff;
    --status-in_progress-fg: #17469e;
    --status-blocked-bg: #fbdcdc;
    --status-blocked-fg: #a12626;
    --status-interrupted-bg: #fdead2;
    --status-interrupted-fg: #92580a;
    --status-todo-bg: #e6e7ea;
    --status-todo-fg: #46494f;

    --warning-bg: #fff4d6;
    --warning-border: #e8b93a;
    --warning-fg: #6b4c04;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a;
      --surface: #1e2024;
      --surface-alt: #26282d;
      --border: #34363c;
      --text: #e9eaec;
      --text-muted: #a3a7ae;
      --link: #7ea3ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 10px rgba(0, 0, 0, 0.3);

      --status-done-bg: #163c26;
      --status-done-fg: #7fe6a4;
      --status-in_progress-bg: #12305c;
      --status-in_progress-fg: #9dc0ff;
      --status-blocked-bg: #4a1c1c;
      --status-blocked-fg: #ff9d9d;
      --status-interrupted-bg: #4a3410;
      --status-interrupted-fg: #ffc978;
      --status-todo-bg: #2c2e33;
      --status-todo-fg: #c3c5ca;

      --warning-bg: #3d3110;
      --warning-border: #a3811f;
      --warning-fg: #ffd875;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px clamp(16px, 4vw, 48px) 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }

  header.page-header {
    max-width: 1100px;
    margin: 0 auto 28px;
  }

  header.page-header h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    letter-spacing: -0.01em;
  }

  header.page-header .generated-at {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  section.panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 20px clamp(14px, 3vw, 28px) 26px;
  }

  section.panel h2 {
    margin: 0 0 14px;
    font-size: 1.15rem;
  }

  #drift-section {
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    color: var(--warning-fg);
    border-radius: 12px;
    padding: 18px clamp(14px, 3vw, 28px);
    box-shadow: var(--shadow);
  }

  #drift-section h2 {
    margin: 0 0 10px;
    font-size: 1.1rem;
    color: inherit;
  }

  #drift-section ul {
    margin: 0;
    padding-left: 1.2em;
  }

  #drift-section li {
    margin: 4px 0;
  }

  #drift-section .drift-spec {
    font-weight: 600;
  }

  #drift-section .drift-rule {
    font-style: italic;
    opacity: 0.85;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }

  thead th {
    text-align: left;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px;
    white-space: nowrap;
  }

  tbody td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  tbody tr.spec-row,
  tbody tr.fix-row {
    cursor: pointer;
  }

  tbody tr.spec-row:hover,
  tbody tr.fix-row:hover {
    background: var(--surface-alt);
  }

  tr.detail-row td {
    padding: 0;
    border-bottom: 1px solid var(--border);
  }

  .detail-panel {
    background: var(--surface-alt);
    padding: 14px clamp(10px, 3vw, 22px) 18px;
  }

  .detail-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .toggle-caret {
    display: inline-block;
    width: 1em;
    color: var(--text-muted);
    transition: transform 0.15s ease;
  }

  tr.expanded .toggle-caret {
    transform: rotate(90deg);
  }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-done { background: var(--status-done-bg); color: var(--status-done-fg); }
  .badge-in_progress { background: var(--status-in_progress-bg); color: var(--status-in_progress-fg); }
  .badge-blocked { background: var(--status-blocked-bg); color: var(--status-blocked-fg); }
  .badge-interrupted { background: var(--status-interrupted-bg); color: var(--status-interrupted-fg); }
  .badge-todo { background: var(--status-todo-bg); color: var(--status-todo-fg); }
  .badge-neutral { background: var(--surface-alt); color: var(--text-muted); border: 1px solid var(--border); }

  table.task-table {
    background: transparent;
  }

  table.task-table thead th {
    border-bottom: 1px solid var(--border);
  }

  table.task-table tbody td {
    border-bottom: 1px solid var(--border);
  }

  table.task-table tbody tr:last-child td {
    border-bottom: none;
  }

  .task-note {
    display: block;
    margin-top: 3px;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .empty-state {
    color: var(--text-muted);
    font-style: italic;
    padding: 6px 2px;
  }

  .fix-detail dl {
    margin: 0;
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 16px;
  }

  .fix-detail dt {
    color: var(--text-muted);
    font-weight: 600;
  }

  .fix-detail dd {
    margin: 0;
    white-space: pre-wrap;
  }

  code, .mono {
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    font-size: 0.9em;
  }

  .kpi-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .kpi-card {
    flex: 1 1 180px;
    min-width: 0;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .kpi-value {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .kpi-label {
    color: var(--text-muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .kpi-status-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .kpi-status-badge {
    font-weight: 600;
  }

  .progress-bar-wrap {
    margin-top: 16px;
  }

  .progress-bar-label {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .progress-bar-track {
    height: 10px;
    border-radius: 999px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--status-done-fg);
    border-radius: 999px;
    transition: width 0.2s ease;
  }

  .spec-progress-wrap {
    min-width: 110px;
  }

  .spec-progress-track {
    display: flex;
    height: 8px;
    border-radius: 999px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .spec-progress-segment {
    height: 100%;
  }

  .spec-progress-text {
    margin-top: 4px;
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .depends-on-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .badge-dependency {
    cursor: pointer;
  }

  .badge-dependency:hover {
    opacity: 0.75;
  }

  tr.next-eligible td:first-child {
    border-left: 3px solid var(--link);
  }

  .roadmap-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }

  .roadmap-filter-input,
  .roadmap-filter-select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.88rem;
    font-family: inherit;
  }

  .roadmap-filter-input {
    flex: 1 1 220px;
    min-width: 0;
  }

  .roadmap-filter-input:focus,
  .roadmap-filter-select:focus {
    outline: 2px solid var(--link);
    outline-offset: 1px;
  }

  tr.filtered-out {
    display: none;
  }

  @keyframes row-highlight-pulse {
    0% { background-color: var(--status-in_progress-bg); }
    100% { background-color: transparent; }
  }

  tr.row-highlight {
    animation: row-highlight-pulse 1.6s ease-out;
  }
</style>
</head>
<body>

<header class="page-header">
  <h1>specloop dashboard</h1>
  <div class="generated-at" id="generated-at"></div>
</header>

<main>
  <section id="drift-section" hidden>
    <h2>⚠ Stage/Status drift</h2>
    <ul id="drift-list"></ul>
  </section>

  <section class="panel" id="kpi-section">
    <h2>Overview</h2>
    <div class="kpi-strip" id="kpi-strip"></div>
    <div class="progress-bar-wrap" id="overall-progress-wrap">
      <div class="progress-bar-label">
        <span>Overall progress</span>
        <span id="overall-progress-text"></span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="overall-progress-fill"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="roadmap-section">
    <h2>Roadmap</h2>
    <div class="roadmap-filters">
      <input type="text" id="roadmap-search" class="roadmap-filter-input" placeholder="Filter by ID or plan…" aria-label="Filter roadmap by ID or plan">
      <select id="roadmap-status-filter" class="roadmap-filter-select" aria-label="Filter roadmap by status">
        <option value="">All statuses</option>
        <option value="todo">todo</option>
        <option value="in_progress">in_progress</option>
        <option value="blocked">blocked</option>
        <option value="interrupted">interrupted</option>
        <option value="done">done</option>
      </select>
    </div>
    <table id="roadmap-table">
      <thead>
        <tr>
          <th></th>
          <th>ID</th>
          <th>Plan</th>
          <th>Status</th>
          <th>Progress</th>
          <th>Depends on</th>
          <th>Stage</th>
          <th>Priority</th>
        </tr>
      </thead>
      <tbody id="roadmap-body"></tbody>
    </table>
  </section>

  <section class="panel" id="fix-log-section">
    <h2>Fix log</h2>
    <div id="fix-log-body"></div>
  </section>
</main>

<script type="application/json" id="dashboard-data">__DASHBOARD_DATA_JSON__</script>
<script>
(function () {
  "use strict";

  var STATUS_LABELS = {
    done: "done",
    in_progress: "in_progress",
    blocked: "blocked",
    interrupted: "interrupted",
    todo: "todo"
  };

  function statusBadge(status) {
    var key = STATUS_LABELS.hasOwnProperty(status) ? status : "todo";
    var span = document.createElement("span");
    span.className = "badge badge-" + key;
    span.textContent = status || "todo";
    return span;
  }

  function neutralBadge(value) {
    var span = document.createElement("span");
    span.className = "badge badge-neutral";
    span.textContent = value == null ? "" : value;
    return span;
  }

  function text(tag, content, className) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = content == null ? "" : content;
    return el;
  }

  function cell(content) {
    var td = document.createElement("td");
    if (content instanceof Node) {
      td.appendChild(content);
    } else {
      td.textContent = content == null ? "" : content;
    }
    return td;
  }

  function toggleRow(mainRow, detailRow) {
    var isHidden = detailRow.hidden;
    detailRow.hidden = !isHidden;
    mainRow.classList.toggle("expanded", isHidden);
  }

  function buildTaskTable(tasks) {
    var wrap = document.createElement("div");
    if (!tasks || tasks.length === 0) {
      wrap.appendChild(text("div", "No tasks recorded for this spec.", "empty-state"));
      return wrap;
    }

    var table = document.createElement("table");
    table.className = "task-table";

    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    ["ID", "Owner", "Status", "Text"].forEach(function (h) {
      headRow.appendChild(text("th", h));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    tasks.forEach(function (task) {
      var row = document.createElement("tr");
      row.appendChild(cell(neutralBadge(task.id || "")));
      row.appendChild(cell(neutralBadge(task.owner || "")));
      row.appendChild(cell(statusBadge(task.status)));

      var textCell = document.createElement("td");
      textCell.appendChild(text("span", task.text || ""));
      if (task.note) {
        textCell.appendChild(text("span", task.note, "task-note"));
      }
      row.appendChild(textCell);

      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function buildSpecProgressBar(counts) {
    var wrap = document.createElement("div");
    wrap.className = "spec-progress-wrap";

    var track = document.createElement("div");
    track.className = "spec-progress-track";

    var c = counts || {};
    var order = ["done", "in_progress", "blocked", "interrupted", "todo"];
    var total = order.reduce(function (sum, key) { return sum + (c[key] || 0); }, 0);

    if (total > 0) {
      order.forEach(function (key) {
        var n = c[key] || 0;
        if (n === 0) return;
        var seg = document.createElement("div");
        seg.className = "spec-progress-segment";
        seg.style.flexGrow = n;
        seg.style.background = "var(--status-" + key + "-fg)";
        seg.title = STATUS_LABELS[key] + ": " + n;
        track.appendChild(seg);
      });
    }

    wrap.appendChild(track);
    wrap.appendChild(text(
      "div",
      total === 0 ? "No tasks" : (c.done || 0) + " / " + total + " done",
      "spec-progress-text"
    ));

    return wrap;
  }

  function jumpToSpecRow(specId) {
    var target = document.getElementById("spec-row-" + specId);
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.remove("row-highlight");
    void target.offsetWidth; // restart the animation if it's already mid-run
    target.classList.add("row-highlight");
    target.addEventListener("animationend", function handler() {
      target.classList.remove("row-highlight");
      target.removeEventListener("animationend", handler);
    });
  }

  function buildDependsOnCell(dependsOn) {
    if (!dependsOn || dependsOn.length === 0) {
      return document.createTextNode("—");
    }
    var wrap = document.createElement("div");
    wrap.className = "depends-on-list";
    dependsOn.forEach(function (depId) {
      var badge = neutralBadge(depId);
      badge.classList.add("badge-dependency");
      badge.addEventListener("click", function (event) {
        event.stopPropagation();
        jumpToSpecRow(depId);
      });
      wrap.appendChild(badge);
    });
    return wrap;
  }

  function renderRoadmap(specs) {
    var tbody = document.getElementById("roadmap-body");
    tbody.innerHTML = "";

    if (!specs || specs.length === 0) {
      var row = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 8;
      td.appendChild(text("div", "No specs found in planning/roadmap.md.", "empty-state"));
      row.appendChild(td);
      tbody.appendChild(row);
      return;
    }

    specs.forEach(function (spec) {
      var mainRow = document.createElement("tr");
      mainRow.className = "spec-row" + (spec.nextEligible ? " next-eligible" : "");
      mainRow.id = "spec-row-" + (spec.id || "");
      mainRow.dataset.specId = (spec.id || "").toLowerCase();
      mainRow.dataset.specPlan = (spec.plan || "").toLowerCase();
      mainRow.dataset.specStatus = spec.status || "";

      var caretCell = document.createElement("td");
      caretCell.appendChild(text("span", "▸", "toggle-caret"));
      mainRow.appendChild(caretCell);

      var idCell = document.createElement("td");
      idCell.appendChild(document.createTextNode(spec.id || ""));
      if (spec.nextEligible) {
        var nextUpBadge = neutralBadge("Next up");
        nextUpBadge.style.marginLeft = "6px";
        idCell.appendChild(nextUpBadge);
      }
      mainRow.appendChild(idCell);
      mainRow.appendChild(cell(spec.plan || ""));
      mainRow.appendChild(cell(statusBadge(spec.status)));
      mainRow.appendChild(cell(buildSpecProgressBar(spec.counts)));
      mainRow.appendChild(cell(buildDependsOnCell(spec.dependsOn)));
      mainRow.appendChild(cell(spec.stage || "—"));
      mainRow.appendChild(cell(spec.priority || "—"));

      var detailRow = document.createElement("tr");
      detailRow.className = "detail-row";
      detailRow.hidden = true;
      var detailCell = document.createElement("td");
      detailCell.colSpan = 8;
      var panel = document.createElement("div");
      panel.className = "detail-panel";
      var meta = document.createElement("div");
      meta.className = "detail-meta";
      meta.appendChild(text("span", "Priority:"));
      meta.appendChild(neutralBadge(spec.priority || "—"));
      panel.appendChild(meta);
      panel.appendChild(buildTaskTable(spec.tasks));
      detailCell.appendChild(panel);
      detailRow.appendChild(detailCell);

      mainRow.addEventListener("click", function () {
        toggleRow(mainRow, detailRow);
      });

      tbody.appendChild(mainRow);
      tbody.appendChild(detailRow);
    });

    var emptyRow = document.createElement("tr");
    emptyRow.id = "roadmap-filter-empty";
    emptyRow.hidden = true;
    var emptyTd = document.createElement("td");
    emptyTd.colSpan = 8;
    emptyTd.appendChild(text("div", "No specs match the current filter.", "empty-state"));
    emptyRow.appendChild(emptyTd);
    tbody.appendChild(emptyRow);
  }

  function filterRoadmap() {
    var searchInput = document.getElementById("roadmap-search");
    var statusSelect = document.getElementById("roadmap-status-filter");
    var tbody = document.getElementById("roadmap-body");
    if (!tbody) return;

    var query = searchInput ? searchInput.value.trim().toLowerCase() : "";
    var statusFilter = statusSelect ? statusSelect.value : "";
    var rows = tbody.querySelectorAll("tr.spec-row");
    var anyVisible = false;

    rows.forEach(function (mainRow) {
      var detailRow = mainRow.nextElementSibling;
      var matchesQuery = !query ||
        (mainRow.dataset.specId || "").indexOf(query) !== -1 ||
        (mainRow.dataset.specPlan || "").indexOf(query) !== -1;
      var matchesStatus = !statusFilter || mainRow.dataset.specStatus === statusFilter;
      var visible = matchesQuery && matchesStatus;

      mainRow.classList.toggle("filtered-out", !visible);
      if (detailRow && detailRow.classList.contains("detail-row")) {
        detailRow.classList.toggle("filtered-out", !visible);
      }
      if (visible) anyVisible = true;
    });

    var emptyRow = document.getElementById("roadmap-filter-empty");
    if (emptyRow) {
      emptyRow.hidden = anyVisible || rows.length === 0;
    }
  }

  function initRoadmapFilters() {
    var searchInput = document.getElementById("roadmap-search");
    var statusSelect = document.getElementById("roadmap-status-filter");
    if (searchInput) searchInput.addEventListener("input", filterRoadmap);
    if (statusSelect) statusSelect.addEventListener("change", filterRoadmap);
  }

  function renderDrift(drift) {
    var section = document.getElementById("drift-section");
    var list = document.getElementById("drift-list");
    list.innerHTML = "";

    if (!drift || drift.length === 0) {
      section.hidden = true;
      return;
    }

    section.hidden = false;
    drift.forEach(function (entry) {
      var li = document.createElement("li");
      li.appendChild(text("span", (entry.specId || "?") + ": ", "drift-spec"));
      if (entry.rule) {
        li.appendChild(text("span", entry.rule + " — ", "drift-rule"));
      }
      li.appendChild(document.createTextNode(entry.message || ""));
      list.appendChild(li);
    });
  }

  function buildFixDetail(fix) {
    var wrap = document.createElement("div");
    wrap.className = "fix-detail";
    var dl = document.createElement("dl");

    if (fix.found) {
      dl.appendChild(text("dt", "Found"));
      dl.appendChild(text("dd", fix.found));
    }
    if (fix.fix) {
      dl.appendChild(text("dt", "Fix"));
      dl.appendChild(text("dd", fix.fix));
    }

    if (!dl.children.length) {
      wrap.appendChild(text("div", "No Found/Fix detail recorded.", "empty-state"));
      return wrap;
    }

    wrap.appendChild(dl);
    return wrap;
  }

  function renderFixLog(fixes) {
    var container = document.getElementById("fix-log-body");
    container.innerHTML = "";

    if (!fixes || fixes.length === 0) {
      container.appendChild(text("div", "No fix-log entries.", "empty-state"));
      return;
    }

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    ["", "ID", "Name", "Scope", "Status", "Date"].forEach(function (h) {
      headRow.appendChild(text("th", h));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");

    fixes.forEach(function (fix) {
      var mainRow = document.createElement("tr");
      mainRow.className = "fix-row";

      var caretCell = document.createElement("td");
      caretCell.appendChild(text("span", "▸", "toggle-caret"));
      mainRow.appendChild(caretCell);

      mainRow.appendChild(cell(fix.id || ""));
      mainRow.appendChild(cell(fix.name || ""));
      mainRow.appendChild(cell(fix.scope || "—"));
      mainRow.appendChild(cell(fix.status || "—"));
      mainRow.appendChild(cell(fix.date || "—"));

      var detailRow = document.createElement("tr");
      detailRow.className = "detail-row";
      detailRow.hidden = true;
      var detailCell = document.createElement("td");
      detailCell.colSpan = 6;
      var panel = document.createElement("div");
      panel.className = "detail-panel";
      panel.appendChild(buildFixDetail(fix));
      detailCell.appendChild(panel);
      detailRow.appendChild(detailCell);

      mainRow.addEventListener("click", function () {
        toggleRow(mainRow, detailRow);
      });

      tbody.appendChild(mainRow);
      tbody.appendChild(detailRow);
    });

    table.appendChild(tbody);
    container.appendChild(table);
  }

  function specStatusCounts(specs) {
    var counts = { todo: 0, in_progress: 0, blocked: 0, interrupted: 0, done: 0 };
    (specs || []).forEach(function (spec) {
      var key = counts.hasOwnProperty(spec.status) ? spec.status : "todo";
      counts[key] += 1;
    });
    return counts;
  }

  function taskCompletionPercent(totals) {
    if (!totals) return null;
    var sum = (totals.todo || 0) + (totals.in_progress || 0) + (totals.blocked || 0) +
      (totals.interrupted || 0) + (totals.done || 0);
    if (sum === 0) return null;
    return Math.round(((totals.done || 0) / sum) * 100);
  }

  function buildKpiValueCard(label, value) {
    var card = document.createElement("div");
    card.className = "kpi-card";
    card.appendChild(text("div", value, "kpi-value"));
    card.appendChild(text("div", label, "kpi-label"));
    return card;
  }

  function buildKpiStatusCard(counts) {
    var card = document.createElement("div");
    card.className = "kpi-card";
    card.appendChild(text("div", "Specs by status", "kpi-label"));
    var row = document.createElement("div");
    row.className = "kpi-status-row";
    ["done", "in_progress", "blocked", "interrupted", "todo"].forEach(function (key) {
      var badge = document.createElement("span");
      badge.className = "badge badge-" + key + " kpi-status-badge";
      badge.textContent = STATUS_LABELS[key] + " " + (counts[key] || 0);
      row.appendChild(badge);
    });
    card.appendChild(row);
    return card;
  }

  function renderKpiStrip(data) {
    var container = document.getElementById("kpi-strip");
    if (!container) return;
    container.innerHTML = "";

    container.appendChild(buildKpiStatusCard(specStatusCounts(data.specs)));

    var pct = taskCompletionPercent(data.totals);
    container.appendChild(buildKpiValueCard("Tasks done", pct === null ? "—" : pct + "%"));

    var driftCount = (data.drift || []).length;
    container.appendChild(buildKpiValueCard("Drift flags", String(driftCount)));
  }

  function renderOverallProgress(totals) {
    var fill = document.getElementById("overall-progress-fill");
    var label = document.getElementById("overall-progress-text");
    if (!fill || !label) return;

    var t = totals || {};
    var done = t.done || 0;
    var sum = (t.todo || 0) + (t.in_progress || 0) + (t.blocked || 0) +
      (t.interrupted || 0) + done;
    var pct = sum === 0 ? 0 : Math.round((done / sum) * 100);

    fill.style.width = pct + "%";
    label.textContent = done + " / " + sum + " tasks done (" + pct + "%)";
  }

  function renderGeneratedAt(iso) {
    var el = document.getElementById("generated-at");
    if (!iso) {
      el.textContent = "";
      return;
    }
    el.textContent = "Generated " + iso;
  }

  function main() {
    var dataEl = document.getElementById("dashboard-data");
    var raw = dataEl ? dataEl.textContent : "";
    var data;
    try {
      data = JSON.parse(raw);
    } catch (err) {
      data = { generatedAt: "", specs: [], drift: [], fixes: [] };
    }

    renderGeneratedAt(data.generatedAt);
    renderDrift(data.drift);
    renderKpiStrip(data);
    renderOverallProgress(data.totals);
    renderRoadmap(data.specs);
    renderFixLog(data.fixes);
    initRoadmapFilters();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", main);
  } else {
    main();
  }
})();
</script>
</body>
</html>
